services:
  healthsync:
    image: ghcr.io/andrepcg/healthsync:latest
    # To build locally instead of pulling from GHCR, comment `image:` above and
    # uncomment:
    # build: .
    container_name: healthsync
    restart: unless-stopped
    ports:
      # Host port is configurable: set HEALTHSYNC_PORT in the stack's
      # environment (Portainer: "Environment variables" on the stack, or a .env
      # file next to this compose). The container always listens on 8080.
      - "${HEALTHSYNC_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Europe/Lisbon}
      HEALTHSYNC_DATA_DIR: /data
      HEALTHSYNC_NO_UPDATE_CHECK: "1"
      # Optional: the address agents should use, rendered into /skill/SKILL.md.
      # Leave empty to derive it from each request.
      HEALTHSYNC_PUBLIC_URL: ${HEALTHSYNC_PUBLIC_URL:-}
    volumes:
      # Holds people.db plus one SQLite file per person. Back this up.
      - healthsync-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  healthsync-data:
